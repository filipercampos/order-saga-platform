{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "saga.serviceAccount" . }}
  labels:
    {{- include "saga.labels" . | nindent 4 }}
  annotations:
    eks.amazonaws.com/role-arn: {{ required "serviceAccount.roleArn is required (IRSA)" .Values.serviceAccount.roleArn | quote }}
{{- end }}
{{- if .Values.http.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "saga.name" . }}
  labels:
    {{- include "saga.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "saga.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
{{- end }}
{{- if .Values.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "saga.name" . }}
  labels:
    {{- include "saga.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "saga.name" . }}
  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.targetCPUUtilizationPercentage }}
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
{{- end }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "saga.name" . }}
  labels:
    {{- include "saga.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "saga.selectorLabels" . | nindent 6 }}
{{- if .Values.networkPolicy.enabled }}
---
# Only the ingress controller namespace may call the HTTP port; egress is unrestricted
# because AWS endpoints (SNS, SQS, RDS, DocumentDB, ledger ALB) are resolved via VPC DNS.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "saga.name" . }}
  labels:
    {{- include "saga.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "saga.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress
      ports:
        - port: http
{{- end }}
