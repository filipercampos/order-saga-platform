# order-service: public API (behind the ALB ingress), saga orchestrator, outbox relay.
# EC2 node group: steady baseline load, latency-sensitive, uses the node ADOT DaemonSet.
service: order
compute: ec2
serviceAccount:
  roleArn: arn:aws:iam::000000000000:role/saga-prod-order-service
existingSecret: saga-order-service  # DB_*, MONGO_URL (DocumentDB, TLS)
env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: "000000000000"
  MESSAGING_NAMESPACE: saga-prod
  AUTH_MODE: cognito
  COGNITO_USER_POOL_ID: us-east-1_EXAMPLE
  COGNITO_CLIENT_IDS: web-client-id,operations-client-id
  SAGA_RESERVE_TIMEOUT_MS: "30000"
  SAGA_CHARGE_TIMEOUT_MS: "90000"
  SAGA_COMPENSATION_TIMEOUT_MS: "30000"
  SAGA_MAX_COMPENSATION_ATTEMPTS: "8"
  # The read-model projector runs as its own release (order-history-projector.yaml).
  PROJECTOR_ENABLED: "false"
resources:
  requests:
    cpu: 500m
    memory: 384Mi
  limits:
    memory: 768Mi
autoscaling:
  minReplicas: 3
  maxReplicas: 12
